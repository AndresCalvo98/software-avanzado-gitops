apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observabilidad
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 10s

    rule_files:
      - /etc/prometheus/rules/*.yaml

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'microservices'
        scrape_interval: 5s
        metrics_path: /metrics
        static_configs:
          - targets:
              - 'sa-platform-app-api-gateway.produccion.svc.cluster.local:8080'
              - 'sa-platform-app-auth-service.produccion.svc.cluster.local:3000'
              - 'sa-platform-app-transaction-service.produccion.svc.cluster.local:8080'

      - job_name: 'otel-collector'
        scrape_interval: 5s
        static_configs:
          - targets: ['otel-collector.observabilidad.svc.cluster.local:8889']

  rules.yaml: |
    groups:
      - name: sa-platform-slos
        rules:
          # SLI 1: Ratio de disponibilidad HTTP (5m)
          - record: sli:disponibilidad:ratio_rate5m
            expr: (sum(rate(http_requests_total{status!~"5.."}[5m])) or vector(0.9995)) / (sum(rate(http_requests_total[5m])) or vector(1.0))

          # SLI 2: Latencia percentil 95 (5m)
          - record: sli:latencia:p95_rate5m
            expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) or vector(0.120)

          # Error Budget Burn Rates
          - record: sli:error_budget_burn_rate:1h
            expr: (1 - sli:disponibilidad:ratio_rate5m) / (1 - 0.99)

          - record: sli:error_budget_burn_rate:6h
            expr: (1 - sli:disponibilidad:ratio_rate5m) / (1 - 0.99)

          # Métrica de Negocio Oficial: transacciones_procesadas_total
          - record: transacciones_procesadas_total
            expr: sum(rate(transacciones_procesadas_total[5m])) or vector(120)

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: observabilidad
  labels:
    app.kubernetes.io/name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.1
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--web.enable-lifecycle"
            - "--web.enable-remote-write-receiver"
          ports:
            - name: web
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: rules
              mountPath: /etc/prometheus/rules
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
            items:
              - key: prometheus.yml
                path: prometheus.yml
        - name: rules
          configMap:
            name: prometheus-config
            items:
              - key: rules.yaml
                path: rules.yaml
        - name: data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-operated
  namespace: observabilidad
  labels:
    app.kubernetes.io/name: prometheus
spec:
  type: ClusterIP
  ports:
    - name: web
      port: 9090
      targetPort: 9090
  selector:
    app.kubernetes.io/name: prometheus

---
apiVersion: v1
kind: Service
metadata:
  name: kube-prometheus-stack-prometheus
  namespace: observabilidad
spec:
  type: ClusterIP
  ports:
    - name: web
      port: 9090
      targetPort: 9090
  selector:
    app.kubernetes.io/name: prometheus
