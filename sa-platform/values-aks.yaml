# values-aks.yaml
# Entorno de Producción en AKS (Azure) - Alta Disponibilidad y Resiliencia
global:
  registry: ghcr.io

# API Gateway (2 réplicas distribuidas)
api-gateway:
  replicaCount: 2
  image:
    repository: ghcr.io/andrescalvo98/sa-api-gateway
    tag: "a77ad6744bad4fceee6971b7963b9c2696f29092"
    pullPolicy: Always

# Auth Service (2 réplicas distribuidas)
auth-service:
  replicaCount: 2
  image:
    repository: ghcr.io/andrescalvo98/sa-auth-service
    tag: "a77ad6744bad4fceee6971b7963b9c2696f29092"
    pullPolicy: Always

# Transaction Service (2 réplicas distribuidas)
transaction-service:
  replicaCount: 2
  image:
    repository: ghcr.io/andrescalvo98/sa-transaction-service
    tag: "a77ad6744bad4fceee6971b7963b9c2696f29092"
    pullPolicy: Always

# Approval Service (2 réplicas distribuidas)
approval-service:
  replicaCount: 2
  image:
    repository: ghcr.io/andrescalvo98/sa-approval-service
    tag: "a77ad6744bad4fceee6971b7963b9c2696f29092"
    pullPolicy: Always

# Notification Service (2 réplicas distribuidas)
notification-service:
  replicaCount: 2
  image:
    repository: ghcr.io/andrescalvo98/sa-notification-service
    tag: "a77ad6744bad4fceee6971b7963b9c2696f29092"
    pullPolicy: Always

# Configuración de los CronJobs
cronjobs:
  insertDb:
    suspend: true
    image:
      repository: ghcr.io/andrescalvo98/sa-cronjob-insert-db
      tag: "a77ad6744bad4fceee6971b7963b9c2696f29092"
      pullPolicy: Always
  summaryBroker:
    suspend: true
    image:
      repository: ghcr.io/andrescalvo98/sa-cronjob-summary-broker
      tag: "a77ad6744bad4fceee6971b7963b9c2696f29092"
      pullPolicy: Always

# Persistencia de PostgreSQL (Usará Managed-CSI de Azure)
postgresql:
  enabled: true
  auth:
    username: "postgres"
    password: "secretpassword"
    database: "transacciones"
    existingSecret: ""
  primary:
    persistence:
      enabled: true
      size: 1Gi

rabbitmq:
  auth:
    username: "user"
    password: "password"
    existingPasswordSecret: "sa-platform-secrets"
