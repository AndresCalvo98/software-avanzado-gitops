# values-aks.yaml
# Entorno de Producción en AKS (Azure)

# Configuración Global
global:
  registry: ghcr.io

# API Gateway
api-gateway:
  replicaCount: 2
  image:
    repository: ghcr.io/andrescalvo98/sa-api-gateway
    tag: "a77ad6744bad4fceee6971b7963b9c2696f29092"
    pullPolicy: Always

# Auth Service
auth-service:
  replicaCount: 2
  image:
    repository: ghcr.io/andrescalvo98/sa-auth-service
    tag: "a77ad6744bad4fceee6971b7963b9c2696f29092"
    pullPolicy: Always

# Transaction Service
transaction-service:
  replicaCount: 2
  image:
    repository: ghcr.io/andrescalvo98/sa-transaction-service
    tag: "a77ad6744bad4fceee6971b7963b9c2696f29092"
    pullPolicy: Always

# Approval Service
approval-service:
  replicaCount: 2
  image:
    repository: ghcr.io/andrescalvo98/sa-approval-service
    tag: "a77ad6744bad4fceee6971b7963b9c2696f29092"
    pullPolicy: Always

# Notification Service
notification-service:
  replicaCount: 2
  image:
    repository: ghcr.io/andrescalvo98/sa-notification-service
    tag: "a77ad6744bad4fceee6971b7963b9c2696f29092"
    pullPolicy: Always

# Configuración de los CronJobs
cronjobs:
  insertDb:
    image:
      repository: ghcr.io/andrescalvo98/sa-cronjob-insert-db
      tag: "a77ad6744bad4fceee6971b7963b9c2696f29092"
      pullPolicy: Always
  summaryBroker:
    image:
      repository: ghcr.io/andrescalvo98/sa-cronjob-summary-broker
      tag: "a77ad6744bad4fceee6971b7963b9c2696f29092"
      pullPolicy: Always

# Persistencia de Postgres (Usará los discos Managed-CSI por defecto de AKS)
postgresql:
  primary:
    persistence:
      size: 1Gi
      # No especificamos storageClass para que Azure asigne su default

rabbitmq:
  auth:
    username: "user"
    existingPasswordSecret: "sa-platform-secrets"
