apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ include "microservice.fullname" . }}-load-test
spec:
  metrics:
  - name: load-test
    successCondition: result == "true"
    provider:
      job:
        spec:
          backoffLimit: 1
          template:
            spec:
              containers:
              - name: load-test
                image: loadimpact/k6:0.43.1
                command: ["k6", "run", "-"]
                env:
                  - name: TARGET_URL
                    value: "http://sa-platform-app-api-gateway"
                stdin: true
                stdinOnce: true
                # The script below uses thresholds to fail the analysis if performance degrades
                args:
                  - |
                    import http from 'k6/http';
                    import { check, sleep } from 'k6';
                    export let options = {
                      vus: 10,
                      duration: '10s',
                      thresholds: {
                        http_req_duration: ['p(95)<500'],
                        http_req_failed: ['rate<0.01']
                      }
                    };
                    export default function() {
                      let res = http.get(__ENV.TARGET_URL + '/health');
                      check(res, {
                        'status is 200': (r) => r.status === 200,
                      });
                      sleep(1);
                    }
              restartPolicy: Never
